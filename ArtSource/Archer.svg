<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <style>
    .o{stroke:#1c1712;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .t{stroke:#1c1712;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .f{fill:none;stroke:#2a2018;stroke-width:2;stroke-linecap:round;opacity:.5}
    .hl{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;opacity:.4}
    .st{fill:none;stroke:#e6cfa6;stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
  </style>
  <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8f9466"/><stop offset=".55" stop-color="#626842"/><stop offset="1" stop-color="#363a23"/>
  </linearGradient>
  <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7f8458"/><stop offset="1" stop-color="#4b4f31"/>
  </linearGradient>
  <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6dcc0"/><stop offset=".6" stop-color="#c3b591"/><stop offset="1" stop-color="#8f8262"/>
  </linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ad7944"/><stop offset=".6" stop-color="#744a26"/><stop offset="1" stop-color="#432814"/>
  </linearGradient>
  <linearGradient id="leatherD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7f5530"/><stop offset="1" stop-color="#36210f"/>
  </linearGradient>
  <linearGradient id="jerkin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a3a1e"/><stop offset=".3" stop-color="#9c6a3c"/><stop offset=".7" stop-color="#7a4f2a"/><stop offset="1" stop-color="#432913"/>
  </linearGradient>
  <linearGradient id="hose" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#776c5a"/><stop offset="1" stop-color="#433b31"/>
  </linearGradient>
  <linearGradient id="hoseD" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5c5346"/><stop offset="1" stop-color="#312b23"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0c39b"/><stop offset=".6" stop-color="#d39a72"/><stop offset="1" stop-color="#a26a48"/>
  </linearGradient>
  <linearGradient id="bow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6a4320"/><stop offset=".5" stop-color="#c79a5e"/><stop offset="1" stop-color="#7a4f26"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef1f2"/><stop offset=".5" stop-color="#a3abb1"/><stop offset="1" stop-color="#4f575e"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f1d58a"/><stop offset=".5" stop-color="#b58a3a"/><stop offset="1" stop-color="#6b4c1a"/>
  </linearGradient>
</defs>

