<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
  <style>
    .o{stroke:#1c1712;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .t{stroke:#1c1712;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .f{fill:none;stroke:#6e624a;stroke-width:2;stroke-linecap:round;opacity:.6}
    .fd{fill:none;stroke:#2a2018;stroke-width:2;stroke-linecap:round;opacity:.5}
    .hl{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;opacity:.6}
    .st{fill:none;stroke:#e6cfa6;stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
  </style>
  <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbf8ef"/><stop offset=".5" stop-color="#e2d9c2"/><stop offset="1" stop-color="#a99b7b"/>
  </linearGradient>
  <linearGradient id="robeFar" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#cfc4a8"/><stop offset="1" stop-color="#8a7d60"/>
  </linearGradient>
  <linearGradient id="cream" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e3d3a8"/><stop offset=".5" stop-color="#f3e8c9"/><stop offset="1" stop-color="#c2ae80"/>
  </linearGradient>
  <linearGradient id="cross" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e05a48"/><stop offset=".6" stop-color="#b3302a"/><stop offset="1" stop-color="#7a1c18"/>
  </linearGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ad7944"/><stop offset=".6" stop-color="#744a26"/><stop offset="1" stop-color="#432814"/>
  </linearGradient>
  <linearGradient id="leatherD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7f5530"/><stop offset="1" stop-color="#36210f"/>
  </linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0c39b"/><stop offset=".6" stop-color="#d39a72"/><stop offset="1" stop-color="#a26a48"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8a6240"/><stop offset="1" stop-color="#3e2716"/>
  </linearGradient>
  <linearGradient id="trim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d9b56a"/><stop offset="1" stop-color="#8a6a2c"/>
  </linearGradient>
  <linearGradient id="rope" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8c08a"/><stop offset="1" stop-color="#8e7444"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#eaffd8" stop-opacity=".95"/><stop offset=".35" stop-color="#9cf08a" stop-opacity=".55"/><stop offset=".7" stop-color="#56c95a" stop-opacity=".18"/><stop offset="1" stop-color="#3fae4a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="orb" cx=".38" cy=".33" r=".7">
    <stop offset="0" stop-color="#fbfff2"/><stop offset=".35" stop-color="#b8f59c"/><stop offset=".75" stop-color="#4fbf55"/><stop offset="1" stop-color="#25743a"/>
  </radialGradient>
</defs>

<!-- ============ FAR ARM (behind, swinging back) ============ -->
