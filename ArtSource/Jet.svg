    <path d="M168,282 L322,280 L314,292 L172,292 Z" fill="#1c1712" opacity="0.22"/>
    <path d="M314,290 L176,360" stroke="#f2f2ee" stroke-width="2.5" opacity="0.45"/>
    <g fill="none" stroke="#2c2e2d" stroke-width="1.5" opacity="0.55">
      <path d="M184,296 L146,354"/>
      <path d="M150,346 L188,346"/>
      <path d="M240,296 L176,352" opacity="0.6"/>
