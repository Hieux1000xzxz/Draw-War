        <circle cx="181" cy="240" r="1.1"/><circle cx="181" cy="250" r="1.1"/><circle cx="182" cy="270" r="1.1"/><circle cx="182" cy="282" r="1.1"/>
        <circle cx="341" cy="238" r="1.1"/><circle cx="341" cy="248" r="1.1"/><circle cx="342" cy="270" r="1.1"/><circle cx="342" cy="280" r="1.1"/>
        <circle cx="401" cy="240" r="1.1"/><circle cx="401" cy="250" r="1.1"/><circle cx="402" cy="270" r="1.1"/>
