    <path d="M66,170 L80,236" stroke="#1c1712" stroke-width="2" opacity="0.55" fill="none"/>
    <path d="M70,146 L170,226" stroke="#eeeeea" stroke-width="2.5" opacity="0.4" fill="none"/>
    <path d="M72,176 C92,170 116,186 124,204 C112,216 90,206 78,196 Z" fill="#5d6261" opacity="0.7"/><path d="M130,212 C144,212 156,220 160,226 L134,230 Z" fill="#5d6261" opacity="0.6"/>
    <!-- fin cap -->
