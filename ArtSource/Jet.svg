<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="jfus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3c5c2"/>
      <stop offset="0.25" stop-color="#a3a6a4"/>
      <stop offset="0.55" stop-color="#868a89"/>
      <stop offset="0.8" stop-color="#9da09e"/>
      <stop offset="1" stop-color="#5f6261"/>
    </linearGradient>
    <linearGradient id="jdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b8f8f"/>
      <stop offset="0.5" stop-color="#6c7070"/>
      <stop offset="1" stop-color="#4d5050"/>
    </linearGradient>
    <linearGradient id="jwing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c9f9d"/>
      <stop offset="0.5" stop-color="#b6b8b5"/>
      <stop offset="1" stop-color="#7d817f"/>
    </linearGradient>
    <linearGradient id="jfin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9bbb8"/>
      <stop offset="0.6" stop-color="#8e9290"/>
      <stop offset="1" stop-color="#6c706f"/>
    </linearGradient>
    <linearGradient id="jglass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f4f0dc"/>
      <stop offset="0.2" stop-color="#c9b77a"/>
      <stop offset="0.55" stop-color="#6b5e3a"/>
      <stop offset="1" stop-color="#2c281c"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8778"/>
      <stop offset="0.3" stop-color="#5e594e"/>
      <stop offset="0.7" stop-color="#3a3630"/>
      <stop offset="1" stop-color="#26231f"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.25" stop-color="#ffd772"/>
      <stop offset="0.6" stop-color="#f08a2c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d0501c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="missile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1efe6"/>
      <stop offset="0.35" stop-color="#cfccc1"/>
      <stop offset="1" stop-color="#77746b"/>
    </linearGradient>
    <linearGradient id="intake" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#0f0d0b"/>
      <stop offset="1" stop-color="#3b3d3c"/>
    </linearGradient>
    <clipPath id="jclip">
      <path d="M72,238 C120,232 200,230 280,230 C330,229 370,226 410,230 C440,234 470,248 494,262 C470,270 440,278 400,284 C340,290 260,292 200,292 C150,292 110,288 72,282 Z"/>
    </clipPath>
    <filter id="jblur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

