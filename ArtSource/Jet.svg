    <path d="M72,238 C120,232 200,230 280,230 C330,229 370,226 410,230 C440,234 470,248 494,262 C470,270 440,278 400,284 C340,290 260,292 200,292 C150,292 110,288 72,282 Z" fill="url(#jfus)" stroke="#1c1712" stroke-width="4"/>

