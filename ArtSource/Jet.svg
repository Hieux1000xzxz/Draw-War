    <path d="M190,288 C220,300 236,318 220,326 C200,330 186,316 182,300 Z" fill="#5d6261" opacity="0.6"/><path d="M140,350 C150,338 166,336 172,344 C168,356 150,362 140,356 Z" fill="#5d6261" opacity="0.6"/>

    <!-- pylons -->
    <path d="M232,300 L262,300 L258,312 L236,312 Z" fill="#5c605f" stroke="#1c1712" stroke-width="2.5"/>
    <path d="M186,326 L214,326 L210,336 L190,336 Z" fill="#5c605f" stroke="#1c1712" stroke-width="2.5"/>

    <!-- missile 1 (inner) -->
    <g>
      <path d="M190,312 L290,312 C300,312 310,316 316,320 C310,324 300,328 290,328 L190,328 Z" fill="url(#missile)" stroke="#1c1712" stroke-width="3"/>
      <path d="M296,312.5 C304,313 310,316 316,320 C310,324 304,327 296,327.5 Z" fill="#6a6656" stroke="#1c1712" stroke-width="2"/>
      <path d="M190,312 L176,302 L170,302 L178,320 L170,338 L176,338 L190,328 Z" fill="#a9a69c" stroke="#1c1712" stroke-width="2.5"/>
      <path d="M262,312 L256,305 L248,305 L250,312 Z M262,328 L256,335 L248,335 L250,328 Z" fill="#a9a69c" stroke="#1c1712" stroke-width="2"/>
      <path d="M196,316 L290,316" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <path d="M232,312 L232,328" stroke="#b49a3c" stroke-width="2.5"/>
