      <g fill="#5d6261" opacity="0.75">
        <path d="M100,232 C130,240 150,236 170,246 C190,256 170,266 140,262 C118,258 104,250 92,246 Z"/>
        <path d="M220,230 C250,236 260,246 290,244 C306,244 312,252 300,258 C276,266 240,256 216,250 C204,246 206,236 220,230 Z"/>
