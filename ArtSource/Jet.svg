    </g>
    <path d="M52,244 L78,241" stroke="#d6cfb8" stroke-width="2" opacity="0.5"/>
    <ellipse cx="49" cy="260" rx="5" ry="19" fill="#2a1a10" stroke="#1c1712" stroke-width="2.5"/>
    <ellipse cx="49" cy="260" rx="3" ry="13" fill="#ffb24a" opacity="0.9"/>

