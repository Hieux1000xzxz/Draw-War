    <!-- missile 2 (outer, lower) -->
    <g>
      <path d="M144,338 L238,338 C248,338 258,342 264,346 C258,350 248,354 238,354 L144,354 Z" fill="url(#missile)" stroke="#1c1712" stroke-width="3"/>
      <path d="M244,338.5 C252,339 258,342 264,346 C258,350 252,353 244,353.5 Z" fill="#6a6656" stroke="#1c1712" stroke-width="2"/>
      <path d="M144,338 L130,328 L124,328 L132,346 L124,364 L130,364 L144,354 Z" fill="#a9a69c" stroke="#1c1712" stroke-width="2.5"/>
      <path d="M212,338 L206,331 L198,331 L200,338 Z M212,354 L206,361 L198,361 L200,354 Z" fill="#a9a69c" stroke="#1c1712" stroke-width="2"/>
      <path d="M150,342 L238,342" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <path d="M184,338 L184,354" stroke="#b49a3c" stroke-width="2.5"/>
