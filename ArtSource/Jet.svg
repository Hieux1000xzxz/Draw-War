      <path d="M50,246 C38,249 28,255 22,260 C28,265 38,271 50,274 Z" fill="#ffe9a8" opacity="0.9"/>
      <path d="M48,252 L40,260 L48,268 L44,260 Z M34,255 L28,260 L34,265 L31,260 Z" fill="#ffffff" opacity="0.9"/>
