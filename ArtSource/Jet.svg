    <path d="M200,231 C240,226 300,222 330,226 L326,233 C290,232 240,232 200,232 Z" fill="#9a9d9b" stroke="#1c1712" stroke-width="2.5"/>
    <!-- air intake (side) -->
    <path d="M262,252 L330,250 L344,256 L344,286 C320,290 290,292 262,290 Z" fill="url(#jdark)" stroke="#1c1712" stroke-width="3.5"/>
    <path d="M330,250 L344,256 L344,286 L326,286 Z" fill="url(#intake)" stroke="#1c1712" stroke-width="3"/>
    <path d="M268,256 L326,254" stroke="#d4d6d2" stroke-width="2" opacity="0.5"/>
