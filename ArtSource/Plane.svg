    <path d="M318,184 C330,186 338,194 342,202" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
    <path d="M284,180 L282,211 M326,180 L332,210" fill="none" stroke="#3e3b22" stroke-width="3.5"/>
    <path d="M246,212 C258,188 282,176 306,175 C330,175 346,190 354,210" fill="none" stroke="#1c1712" stroke-width="4"/>
