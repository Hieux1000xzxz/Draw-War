    <path d="M222,331 L206,324 L204,360 L222,353 Z" fill="#55564d" stroke="#1c1712" stroke-width="3"/>
    <path d="M208,342 L222,342" stroke="#1c1712" stroke-width="2"/>
    <path d="M292,328 L294,356" stroke="#c9b75a" stroke-width="3" opacity="0.8"/>
    <path d="M242,334 C264,330 290,330 306,336" fill="none" stroke="#e4e4d8" stroke-width="2.5" opacity="0.5"/>

