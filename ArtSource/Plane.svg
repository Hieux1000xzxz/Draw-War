        <circle cx="202" cy="222" r="1.2"/><circle cx="203" cy="234" r="1.2"/><circle cx="203" cy="246" r="1.2"/><circle cx="203" cy="258" r="1.2"/><circle cx="204" cy="270" r="1.2"/><circle cx="204" cy="282" r="1.2"/><circle cx="204" cy="294" r="1.2"/>
        <circle cx="356" cy="218" r="1.2"/><circle cx="356" cy="230" r="1.2"/><circle cx="356" cy="242" r="1.2"/><circle cx="357" cy="266" r="1.2"/><circle cx="357" cy="278" r="1.2"/><circle cx="357" cy="290" r="1.2"/>
        <circle cx="90" cy="252" r="1.1"/><circle cx="110" cy="251" r="1.1"/><circle cx="150" cy="250" r="1.1"/><circle cx="170" cy="249" r="1.1"/><circle cx="230" cy="248" r="1.1"/><circle cx="250" cy="248" r="1.1"/><circle cx="270" cy="248" r="1.1"/><circle cx="290" cy="248" r="1.1"/><circle cx="310" cy="248" r="1.1"/>
