      <path d="M421,390 L433,398 L427,407 L415,399 Z"/>
      <path d="M434,398 L446,406 L441,414 L429,406 Z"/>
    </g>
    <!-- headlight -->
    <path d="M440,384 L456,390 L454,402 L438,396 Z" fill="url(#steelG)" stroke-width="3"/>
    <!-- exhaust -->
    <rect x="18" y="382" width="22" height="14" rx="4" fill="url(#steelG)" stroke-width="3"/>
    <path d="M21,389 L37,389" fill="none" stroke="#7a5532" stroke-width="3" stroke-opacity="0.8"/>

    <!-- shovel + pick on hull side -->
    <path d="M146,370 L236,370" fill="none" stroke="#1c1712" stroke-width="9"/>
    <path d="M146,370 L236,370" fill="none" stroke="url(#woodG)" stroke-width="5"/>
    <path d="M232,362 L256,362 Q265,370 256,378 L232,378 Z" fill="url(#steelG)" stroke-width="3"/>
    <rect x="166" y="364" width="6" height="12" fill="#3a3a24" stroke-width="2"/>
    <rect x="212" y="364" width="6" height="12" fill="#3a3a24" stroke-width="2"/>
    <!-- tow cable -->
    <path d="M276,374 Q312,388 346,376 Q370,370 384,392" fill="none" stroke="#1c1712" stroke-width="7"/>
    <path d="M276,374 Q312,388 346,376 Q370,370 384,392" fill="none" stroke="#878270" stroke-width="3" stroke-dasharray="3 3" stroke-linecap="butt"/>

    <!-- rivets -->
    <g fill="#a8a76e" stroke="#2a2818" stroke-width="1.5">
      <circle cx="68" cy="362" r="2.6"/><circle cx="92" cy="362" r="2.6"/><circle cx="116" cy="362" r="2.6"/>
      <circle cx="146" cy="398" r="2.6"/><circle cx="170" cy="398" r="2.6"/><circle cx="194" cy="398" r="2.6"/><circle cx="218" cy="398" r="2.6"/><circle cx="242" cy="398" r="2.6"/>
      <circle cx="278" cy="398" r="2.6"/><circle cx="302" cy="398" r="2.6"/><circle cx="326" cy="398" r="2.6"/><circle cx="350" cy="398" r="2.6"/>
      <circle cx="68" cy="406" r="2.6"/><circle cx="92" cy="406" r="2.6"/><circle cx="116" cy="406" r="2.6"/>
