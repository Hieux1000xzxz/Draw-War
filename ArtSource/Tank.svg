    <path d="M360,308.5 L472,310.5 L472,327 L360,330 Z" fill="url(#barrelG)"/>
    <path d="M370,315.5 L466,316.5" fill="none" stroke="#d6d59c" stroke-width="2" stroke-opacity="0.75"/>
    <rect x="404" y="309" width="12" height="20" rx="3" fill="url(#barrelG)" stroke-width="3.5"/>
    <!-- muzzle brake -->
    <path d="M468,305 L502,305 Q507,305 507,310 L507,328 Q507,333 502,333 L468,333 Z" fill="url(#barrelG)"/>
    <rect x="478" y="312" width="9" height="14" rx="2" fill="#1c1712" stroke="none"/>
    <rect x="491" y="312" width="9" height="14" rx="2" fill="#1c1712" stroke="none"/>
    <path d="M471,309 L503,309" fill="none" stroke="#dcdaa2" stroke-width="2" stroke-opacity="0.65"/>

    <!-- ===== Hull ===== -->
    <path d="M34,368 L58,352 L372,352 L454,404 L456,418 L32,418 Z" fill="url(#hullSide)"/>
    <!-- sloped glacis facet -->
    <path d="M372,352 L454,404 L456,418 L428,418 L364,358 Z" fill="url(#glacis)"/>
    <!-- rear plate facet -->
