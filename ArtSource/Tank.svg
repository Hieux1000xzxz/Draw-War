    <path d="M58,378 L84,408 M84,378 L58,408" fill="none" stroke="#3a3a20" stroke-width="3.5"/>
    <path d="M58,378 L84,408 M84,378 L58,408" fill="none" stroke="#a9a86d" stroke-width="1.2" stroke-opacity="0.6" transform="translate(-1,-1)"/>
    <path d="M58,370 L58,362 L74,362 L74,370" fill="none" stroke-width="3"/>
    <rect x="78" y="363" width="7" height="7" rx="1.5" fill="url(#steelG)" stroke-width="2"/>
    <path d="M56,374 L70,373" fill="none" stroke="#d6d49c" stroke-width="2" stroke-opacity="0.75"/>

    <!-- dust on lower hull -->
    <path d="M32,394 L456,394 L456,418 L32,418 Z" fill="url(#dustG)" stroke="none"/>

    <!-- fender -->
    <path d="M16,416 L460,416 L466,428 L12,428 Z" fill="url(#fenderG)" stroke-width="3.5"/>
    <path d="M19,418.5 L458,418.5" fill="none" stroke="#c7c68e" stroke-width="2" stroke-opacity="0.75"/>

