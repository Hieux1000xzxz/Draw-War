    <!-- deck lit edge -->
    <path d="M40,366 L60,355 L370,355" fill="none" stroke="#c4c38a" stroke-width="3" stroke-opacity="0.85"/>
    <path d="M378,358 L448,403" fill="none" stroke="#d0cf96" stroke-width="2.5" stroke-opacity="0.7"/>
    <!-- plate seams -->
    <path d="M130,360 L130,414 M262,360 L262,414" fill="none" stroke="#28271a" stroke-width="2.5" stroke-opacity="0.85"/>
    <path d="M132,361 L132,413 M264,361 L264,413" fill="none" stroke="#b1b07a" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- driver vision block -->
    <path d="M384,370 L404,382 L400,388 L380,376 Z" fill="#23211b" stroke-width="3"/>
    <!-- spare track links on glacis -->
    <g fill="url(#trackG)" stroke-width="2.5">
