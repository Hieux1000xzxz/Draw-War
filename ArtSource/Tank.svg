    <path d="M58,434 L418,434 Q453,436 455,458 Q455,477 431,492 L411,495 L86,495 Q40,493 31,462 Q33,436 58,434 Z" fill="none" stroke="#a49d86" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="butt" stroke-opacity="0.5" transform="translate(-0.5,-1.5)"/>

