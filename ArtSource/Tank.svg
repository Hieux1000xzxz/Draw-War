    <path d="M60,356 L372,356" fill="none" stroke="#1c1712" stroke-width="3" stroke-opacity="0.6"/>
    <!-- side hatch -->
    <path d="M228,304 L266,304 Q270,304 270,308 L270,330 Q270,334 266,334 L228,334 Q224,334 224,330 L224,308 Q224,304 228,304 Z" fill="url(#turretG)" stroke-width="3"/>
    <path d="M228,307 L266,307" fill="none" stroke="#d3d29a" stroke-width="1.6" stroke-opacity="0.6"/>
    <rect x="240" y="316" width="14" height="5" rx="2" fill="#2a2818" stroke="none"/>
    <circle cx="196" cy="320" r="5" fill="#23211a" stroke-width="2.5"/>
    <!-- turret rivets -->
    <g fill="#b2b177" stroke="#2a2818" stroke-width="1.5">
      <circle cx="170" cy="306" r="2.4"/><circle cx="200" cy="302" r="2.4"/><circle cx="296" cy="300" r="2.4"/><circle cx="324" cy="306" r="2.4"/>
      <circle cx="164" cy="336" r="2.4"/><circle cx="300" cy="336" r="2.4"/><circle cx="330" cy="336" r="2.4"/>
      <circle cx="229" cy="309" r="1.7"/><circle cx="265" cy="309" r="1.7"/><circle cx="229" cy="329" r="1.7"/><circle cx="265" cy="329" r="1.7"/>
    </g>
    <!-- mantlet -->
    <path d="M340,298 L362,296 Q380,300 380,320 Q380,340 362,344 L342,342 Z" fill="url(#turretG)"/>
    <path d="M348,303 Q368,302 373,316" fill="none" stroke="#dcdba2" stroke-width="2.5" stroke-opacity="0.75"/>
    <circle cx="354" cy="305" r="2.2" fill="#b2b177" stroke-width="1.5"/>
    <circle cx="354" cy="336" r="2.2" fill="#b2b177" stroke-width="1.5"/>
    <rect x="376" y="333" width="18" height="5" rx="2" fill="url(#steelG)" stroke-width="2.5"/>

    <!-- commander cupola -->
    <path d="M174,294 L178,272 Q180,266 188,266 L216,266 Q224,266 226,272 L230,293 Z" fill="url(#turretG)"/>
    <g fill="#1f1d17" stroke="none">
      <rect x="184" y="276" width="7" height="5" rx="1"/><rect x="198" y="276" width="7" height="5" rx="1"/><rect x="212" y="276" width="7" height="5" rx="1"/>
    </g>
    <path d="M172,266 Q202,254 232,266 L232,270 L172,270 Z" fill="url(#fenderG)" stroke-width="3"/>
    <path d="M182,263 Q202,258 222,263" fill="none" stroke="#d6d59c" stroke-width="2" stroke-opacity="0.7"/>
    <!-- loader hatch -->
    <path d="M262,291 Q264,281 278,281 L292,281 Q300,283 302,291 Z" fill="url(#turretG)" stroke-width="3"/>

    <!-- ===== Weathering ===== -->
    <g fill="none">
      <path d="M176,340 L177,352 M214,338 L213,352 M304,338 L306,352" stroke="#3b3320" stroke-width="2" stroke-opacity="0.45"/>
      <path d="M70,370 L71,394 M150,382 L151,410 M282,386 L284,410 M362,384 L364,410" stroke="#3b3320" stroke-width="2.5" stroke-opacity="0.35"/>
      <path d="M96,355 l7,0 M300,355 l9,0 M396,366 l5,4 M188,268 l6,-1 M346,312 l2,6 M318,293 l6,0 M24,420 l8,0 M300,420 l10,0" stroke="#e6e4ae" stroke-width="2" stroke-opacity="0.7"/>
      <path d="M158,406 l5,1 M232,408 l4,0 M318,410 l5,-1 M418,410 l4,2 M190,344 l6,0" stroke="#2a2316" stroke-width="3" stroke-opacity="0.5"/>
