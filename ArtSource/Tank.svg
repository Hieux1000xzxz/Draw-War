    <path d="M142,354 L154,306 Q158,294 172,293 L318,290 Q332,290 340,302 L358,332 L358,354 Z" fill="url(#litSpot)" stroke="none"/>
    <path d="M158,306 Q162,298 174,298 L316,295 Q328,296 334,304" fill="none" stroke="#d3d29a" stroke-width="3" stroke-opacity="0.8"/>
