    <linearGradient id="barrelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55552f"/>
      <stop offset="0.28" stop-color="#b0af74"/>
      <stop offset="0.55" stop-color="#6c6b3b"/>
      <stop offset="1" stop-color="#363620"/>
    </linearGradient>
    <linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4a40"/>
      <stop offset="0.3" stop-color="#9a978a"/>
      <stop offset="1" stop-color="#2d2b26"/>
    </linearGradient>
    <linearGradient id="canG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a9858"/>
      <stop offset="0.5" stop-color="#6a6939"/>
      <stop offset="1" stop-color="#3b3b21"/>
    </linearGradient>
    <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08655"/>
      <stop offset="1" stop-color="#5e4127"/>
