    <circle cx="428" cy="458" r="21" fill="none" stroke="#857e69" stroke-width="5" stroke-dasharray="5 5" stroke-linecap="butt"/>
    <circle cx="428" cy="458" r="15" fill="url(#wheelG)" stroke-width="3"/>
    <circle cx="428" cy="458" r="5" fill="url(#hubG)" stroke-width="2"/>
