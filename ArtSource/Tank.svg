    <path d="M26,468 Q60,486 110,488 Q200,494 300,486 Q380,494 458,470 Q456,484 434,497 L412,500 L84,500 Q36,498 26,468 Z" fill="url(#mudG)" stroke="none"/>
    <g fill="#5d4a31" stroke="none" opacity="0.75">
