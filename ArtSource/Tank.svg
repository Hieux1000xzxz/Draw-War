<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hullSide" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#858450"/>
      <stop offset="0.45" stop-color="#666539"/>
      <stop offset="1" stop-color="#3d3d23"/>
    </linearGradient>
    <linearGradient id="glacis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3a268"/>
      <stop offset="0.5" stop-color="#7a7944"/>
      <stop offset="1" stop-color="#4d4d2b"/>
    </linearGradient>
    <linearGradient id="fenderG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a26a"/>
      <stop offset="0.4" stop-color="#6c6b3b"/>
      <stop offset="1" stop-color="#3b3b22"/>
    </linearGradient>
    <linearGradient id="turretG" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a5a46a"/>
      <stop offset="0.35" stop-color="#7a7943"/>
      <stop offset="0.8" stop-color="#55552f"/>
      <stop offset="1" stop-color="#404026"/>
    </linearGradient>
    <linearGradient id="trackG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e4a40"/>
      <stop offset="0.5" stop-color="#34312b"/>
      <stop offset="1" stop-color="#1f1d1a"/>
    </linearGradient>
    <radialGradient id="wheelG" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#9b9a63"/>
      <stop offset="0.55" stop-color="#626237"/>
      <stop offset="1" stop-color="#34341e"/>
