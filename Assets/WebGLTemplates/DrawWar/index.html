<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="screen-orientation" content="landscape">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>

    <!-- Phones only, while held upright: the game is landscape-only. -->
    <div id="rotate-overlay">
      <div id="rotate-phone"></div>
      <p>Xoay ngang điện thoại để chơi<br><small>Rotate your phone to landscape</small></p>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Landscape on a phone: try to go fullscreen and lock the rotation. Browsers only allow both
      // from inside a user gesture, so this runs on the first touch. iPhone Safari supports neither
      // and Android refuses the lock outside fullscreen - the rotate overlay covers those cases.
      function goLandscapeFullscreen() {
        var root = document.documentElement;
        var request = root.requestFullscreen || root.webkitRequestFullscreen;
        var lock = function () {
          if (screen.orientation && screen.orientation.lock)
            screen.orientation.lock("landscape").catch(function () {});
        };

        if (request && !(document.fullscreenElement || document.webkitFullscreenElement)) {
          try {
            var result = request.call(root);
            if (result && result.then) result.then(lock).catch(function () {});
            else lock();
          } catch (e) {}
        } else {
          lock();
        }
      }

      if (isMobile) {
        // Fill the whole browser client area with the game canvas.
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        document.body.classList.add("mobile");

        // Phones report 3x pixel ratios. Crayon lines gain little past ~1.5x, and every step up is
        // paid in fill rate - the main cost of this game on a phone GPU.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

        document.addEventListener("touchend", goLandscapeFullscreen, { passive: true });

        // Fingers draw on the page; keep the browser's own long-press menu,
        // text selection and magnifier out of it.
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

#if SHOW_DIAGNOSTICS
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif
      } else {
        // Desktop: the game sits in a fixed-size window that can be maximized to fullscreen.
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      // Textures: Tools > Build > WebGL (Desktop + Mobile textures) ships two data files, DXT for
      // desktop GPUs and "-astc" for phones. Fetch the one this GPU reads natively - the other would
      // be unpacked on the CPU at load, slowly and at several times the memory. A plain build has
      // no -astc file; the HEAD check then falls back to the normal one.
      function gpuWantsAstc() {
        try {
          var gl = document.createElement("canvas").getContext("webgl2");
          return !!gl && !gl.getExtension("WEBGL_compressed_texture_s3tc") &&
                 !!gl.getExtension("WEBGL_compressed_texture_astc");
        } catch (e) {
          return false;
        }
      }

      function pickDataUrl() {
        if (!gpuWantsAstc()) return Promise.resolve(config.dataUrl);
        var astcUrl = config.dataUrl.replace(/\.data/, "-astc.data");
        return fetch(astcUrl, { method: "HEAD" })
          .then(function (r) { return r.ok ? astcUrl : config.dataUrl; })
          .catch(function () { return config.dataUrl; });
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => pickDataUrl().then((dataUrl) => {
        config.dataUrl = dataUrl;
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
          document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
          };
#endif
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      });

      document.body.appendChild(script);
    </script>
  </body>
</html>
